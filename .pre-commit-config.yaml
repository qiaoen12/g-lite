# ═══════════════════════════════════════════════════════════════════════════
# 提交口门禁。
#
# 为什么规则在这里，而不是手写 .git/hooks/pre-commit：
# .git/ 不进 git。写死在 .git/hooks/ 里的门禁，换台 Mac、重新 clone、
# 换一份 checkout 就消失了，而「记得再装一次」是纪律，不是门禁。
# 本文件进 git，每台机器只需要跑一次 `0-meta/bin/new setup`。
#
# 为什么门禁设在 git commit 这个口子上：
# Cursor / Codex / Claude Code / WorkBuddy / 你自己 / 终端，
# 最后都走同一条 `git commit`，也都指向同一个 .git。
# AI 可以换，编辑器可以换，提交口只有一个。
# 相比之下 .cursorignore 只对 Cursor 生效——那是适配器，这是门禁。
#
# worktree 说明：hooks 挂在 git common dir 上，全部 worktree 共用同一份，
# 不需要逐个安装。
#
# 已知缺口：git commit --no-verify 绕过以下全部。
# 本地补不了，要靠服务端（GitHub branch protection + CI）。
# ═══════════════════════════════════════════════════════════════════════════

minimum_pre_commit_version: "3.5.0"

# 两种钩子类型，查两件不同的事：
#   pre-commit  这次提交的**内容**能不能放行（密钥、路径、git 卫生）
#   commit-msg  这次提交的**名字**合不合规（提交语言）
# 必须都声明。默认 `pre-commit install` 只装 pre-commit 一种，
# 于是 commit-msg 那层会「配置写了但从未生效」——v2.3 之前就是这个状态：
# policy 里躺着一条 commit_convention 正则，没有任何东西在执行它。
default_install_hook_types: [pre-commit, commit-msg]

# 每个 hook 都必须显式声明 stages。不声明的话 pre-commit 会把它挂到
# **所有已安装的钩子类型**上——加了 commit-msg 之后，gitleaks 和工作区自查
# 会在一次 git commit 里各跑两遍。翻倍的等待就是 hook 被关掉的起点。
default_stages: [pre-commit]

repos:
  # 密钥搜捕。只扫暂存区的 diff，不扫全库，所以是秒级。
  # rev 钉死是为了「同一份配置在任何机器上跑同一个版本」——
  # 用 id: gitleaks-system 会改成调用本机 brew 装的那个，快但会版本漂移。
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: 密钥搜捕（gitleaks，只看暂存区）

  # 工作区自查的 commit 档：plan_staleness + 明文凭据 + git 卫生 + 命名。
  # 明确用 --tier commit，不要换成不带参数的 new check——
  # 那是 daily 档全树扫描，工作区长大之后每次提交要等十几秒，
  # 真实结局是这个 hook 被关掉。被关掉的门禁比没有门禁更糟。
  - repo: local
    hooks:
      - id: workspace-check
        name: 工作区自查（commit 档）
        entry: 0-meta/bin/new
        args: [check, --tier, commit]
        language: system
        pass_filenames: false
        always_run: true

      # 提交语言。规则读自 derived.lock，脚本里不写死词表。
      # 与 daily 档回扫是同一个脚本、同一套例外判断，只是入口不同：
      # 两边各写一份的话，钩子放行的提交会被审计天天报，
      # 而「审计总在报一件你已经决定允许的事」是门禁被关掉的标准前奏。
      - id: commit-language
        name: 提交语言（type × scope）
        entry: 0-meta/audit/scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
