name: PR gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            .github/ISSUE_TEMPLATE/task.md
            .github/pull_request_template.md
            .github/workflows/pr-gate.yml
            tools/repo-reconciler/manifest.json
            tools/repo-reconciler/reconcile.sh
            tools/repo-reconciler/lib/audit.sh
            tools/repo-reconciler/lib/apply.sh
          )
          fail=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "missing required file: $f"
              fail=1
            fi
          done
          [ "$fail" = 0 ]

      - name: Protocol headings
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          need() {
            local file="$1"
            local pattern="$2"
            if ! grep -Fq "$pattern" "$file"; then
              echo "missing in ${file}: ${pattern}"
              fail=1
            fi
          }
          need README.md "核心闭环"
          need README.md "Issue Contract"
          need README.md "approved"
          need README.md "pr-gate"
          need README.md "squash"
          need AGENTS.md "## 开工"
          need AGENTS.md "## Reviewer protocol"
          need AGENTS.md "lastEditedAt"
          need AGENTS.md "Fresh authorization:"
          need .github/ISSUE_TEMPLATE/task.md "## Contract"
          need .github/ISSUE_TEMPLATE/task.md "### Goal"
          need .github/ISSUE_TEMPLATE/task.md "### Acceptance"
          need .github/ISSUE_TEMPLATE/task.md "### Out of scope"
          need .github/ISSUE_TEMPLATE/task.md "### Authorization"
          need .github/pull_request_template.md "## Why"
          need .github/pull_request_template.md "Issue Contract:"
          need .github/pull_request_template.md "## What"
          need .github/pull_request_template.md "## Test"
          need .github/pull_request_template.md "## Unverified / Risks"
          need .github/pull_request_template.md "Fixes #"
          need README.md "Thin Repo Reconciler"
          need AGENTS.md "## Repo Reconciler"
          need tools/repo-reconciler/reconcile.sh "audit|plan|apply|upgrade"
          [ "$fail" = 0 ]

      - name: Reconciler static validation
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/repo-reconciler/reconcile.sh
          bash -n tools/repo-reconciler/lib/audit.sh
          bash -n tools/repo-reconciler/lib/apply.sh
          jq -e '
            .schema_version == 1 and
            (.protocol.exact | length > 0) and
            (.protocol.semantic | length > 0) and
            (.protocol.live_facts | length > 0) and
            (.states | index("PASS")) and
            (.states | index("DRIFT")) and
            (.states | index("PLATFORM_BLOCKER")) and
            (.states | index("PERMISSION_BLOCKER")) and
            (.states | index("UNVERIFIED"))
          ' tools/repo-reconciler/manifest.json >/dev/null

      - name: Genesis and stale-checkout guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- "--genesis" tools/repo-reconciler/reconcile.sh
          grep -Fq -- "--reviewer-gh-config" tools/repo-reconciler/reconcile.sh
          grep -Fq -- "LEGACY G-LITE RUNTIME DETECTED" tools/repo-reconciler/reconcile.sh
          grep -Fq -- "allowed_merge_methods" tools/repo-reconciler/lib/audit.sh
          grep -Fq -- "--method PUT" tools/repo-reconciler/lib/apply.sh
          ! grep -Fq -- "allow_merge_commit" tools/repo-reconciler/lib/audit.sh
          ! grep -Fq -- "allow_rebase_merge" tools/repo-reconciler/lib/audit.sh

      - name: Banned legacy paths
        shell: bash
        run: |
          set -euo pipefail
          banned=(
            0-meta
            1-code
            2-infra
            3-data
            4-know
            5-record
            _inbox
            _vendor
            .agents
            .pre-commit-config.yaml
            .claude
            .cursorignore
            .aiignore
            .github/workflows/main-guard.yml
          )
          fail=0
          for p in "${banned[@]}"; do
            if [ -e "$p" ]; then
              echo "legacy path reappeared: $p"
              fail=1
            fi
          done
          [ "$fail" = 0 ]
