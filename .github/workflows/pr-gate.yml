name: PR gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find 0-meta .agents -type f \( -name '*.sh' -o -path '0-meta/bin/new' \) -print0)

      - name: Runtime regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in 0-meta/lib/new/*.test.sh; do
            echo "==> $test_file"
            bash "$test_file"
          done
