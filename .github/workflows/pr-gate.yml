name: PR gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          roots=(0-meta)
          if [ -d .agents ]; then roots+=(.agents); fi
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find "${roots[@]}" -type f \( -name '*.sh' -o -path '0-meta/bin/new' \) -print0)

      - name: Anti-regression
        shell: bash
        run: |
          set -euo pipefail
          banned=(
            0-meta/tasks
            .agents/skills/zdev
            .agents/skills/zfix
            .agents/skills/zreview
            .agents/skills/zsync
            .agents/skills/zpr
            .agents/skills/zmerge
            .agents/skills/z-lib.sh
            2-infra/git-guard
            .github/workflows/main-guard.yml
          )
          fail=0
          for p in "${banned[@]}"; do
            if [ -e "$p" ]; then
              echo "legacy path reappeared: $p"
              fail=1
            fi
          done
          [ "$fail" = 0 ]

      - name: Workspace setup regression
        shell: bash
        run: |
          set -euo pipefail
          bash 0-meta/lib/new/setup.test.sh
